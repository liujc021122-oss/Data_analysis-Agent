[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.2.0"
description = "Installable data analysis agent with offline-testable LLM orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "duckdb>=0.8.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.14.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "ipython>=8.10.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-docx>=0.8.11",
    "typing-extensions>=4.5.0",
    "fonttools>=4.38.0",
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.21,<5.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "PyMySQL>=1.1,<2.0",
    "charset-normalizer>=3.0,<4.0",
    "boto3>=1.28.0,<2.0",
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "httpx>=0.27,<1.0",
]
api = [
    "uvicorn>=0.30,<1.0",
]
worker = [
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
]

[project.scripts]
data-analysis-agent = "data_analysis_agent.cli:main"
data-analysis-agent-worker = "data_analysis_agent.worker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
