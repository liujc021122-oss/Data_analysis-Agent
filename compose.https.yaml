services:
  reverse-proxy:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx/reverse-proxy-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "--timeout=3", "https://127.0.0.1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
